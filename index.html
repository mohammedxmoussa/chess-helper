<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Position Library</title><style>body{font-family:Georgia,serif;background:#FAF7F0;color:#1C1917;margin:0;padding:20px}main{max-width:1000px;margin:0 auto}h1{font-size:26px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select{padding:9px 12px;border-radius:999px;border:1px solid #E2DCCB;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #E2DCCB;border-radius:14px;padding:14px}.bd{border-collapse:collapse;border:2px solid #5C4033}.bd td{width:32px;height:32px;text-align:center;font-size:23px;line-height:1}.bd .l{background:#EBECD0}.bd .d{background:#739552}.meta{font-size:13px;color:#6B665E}.tags{font-size:12px}.sol{display:none;font-family:monospace;font-weight:bold}.notes{font-size:13px;white-space:pre-wrap}.fen{font-family:monospace;font-size:10px;word-break:break-all;color:#6B665E}button{padding:7px 12px;border-radius:999px;border:1px solid #1B4332;background:#1B4332;color:#fff;cursor:pointer}</style></head><body><main><h1>♞ My Position Library</h1><p id="count"></p><div class="bar"><input id="q" type="search" placeholder="Search title, tag, FEN…" aria-label="Search positions"><select id="folder" aria-label="Folder"><option value="all">All folders</option><option value="none">Unfiled</option></select><select id="diff" aria-label="Difficulty"><option value="0">All difficulties</option><option value="1">1 ★ Beginner</option><option value="2">2 ★ Easy</option><option value="3">3 ★ Intermediate</option><option value="4">4 ★ Advanced</option><option value="5">5 ★ Master</option></select><select id="phase" aria-label="Phase"><option value="">All phases</option><option>Opening</option><option>Middlegame</option><option>Endgame</option></select><input id="opening" type="search" placeholder="Opening name…" aria-label="Opening name"></div><div class="grid" id="grid"></div></main><script type="application/json" id="lib-data">{"positions":[],"folders":[]}</script><script>var DATA = JSON.parse(document.getElementById('lib-data').textContent);
var GLYPH = {K:'\u2654',Q:'\u2655',R:'\u2656',B:'\u2657',N:'\u2658',P:'\u2659',k:'\u265A',q:'\u265B',r:'\u265C',b:'\u265D',n:'\u265E',p:'\u265F'};
var DIFF = ['','Beginner','Easy','Intermediate','Advanced','Master'];
function parseBoard(fen){var rows=(fen.split(' ')[0]||'').split('/');var out=[];for(var r=0;r<8;r++){var row=[];var s=rows[r]||'8';for(var i=0;i<s.length;i++){var ch=s.charAt(i);if(/\d/.test(ch)){for(var j=0;j<parseInt(ch);j++)row.push(null);}else row.push(ch);}while(row.length<8)row.push(null);out.push(row);}return out;}
function boardHtml(fen){var b=parseBoard(fen);var h='<table class="bd">';for(var r=0;r<8;r++){h+='<tr>';for(var c=0;c<8;c++){var p=b[r][c];var light=(r+c)%2===0;var col=p&&p===p.toUpperCase()?'#fff;text-shadow:0 0 3px #000':'#111';h+='<td class="'+(light?'l':'d')+'" style="color:'+col+'">'+(p?GLYPH[p]:'')+'</td>';}h+='</tr>';}return h+'</table>';}
function folderName(id){if(id===null)return 'Unfiled';for(var i=0;i<DATA.folders.length;i++){if(DATA.folders[i].id===id)return DATA.folders[i].name;}return 'Unfiled';}
function render(){var q=(document.getElementById('q').value||'').toLowerCase();var f=document.getElementById('folder').value;var d=document.getElementById('diff').value;var ph=document.getElementById('phase').value;var op=(document.getElementById('opening').value||'').toLowerCase();
var html='';var shown=0;DATA.positions.forEach(function(p){if(f!=='all'&&String(p.folderId)!==f&&!(f==='none'&&p.folderId===null))return;if(d!=='0'&&p.difficulty!==parseInt(d))return;if(ph&&p.phase!==ph)return;if(op&&(p.openingName||'').toLowerCase().indexOf(op)===-1)return;
if(q&&(p.title+' '+p.tags+' '+p.fen+' '+(p.openingName||'')).toLowerCase().indexOf(q)===-1)return;shown++;
html+='<div class="card"><h3>'+p.title.replace(/</g,'&lt;')+'</h3>'+boardHtml(p.fen)+'<p class="meta">'+'\u2605'.repeat(p.difficulty)+' '+DIFF[p.difficulty]+' \u00B7 '+folderName(p.folderId)+' \u00B7 '+(p.fen.split(' ')[1]==='b'?'Black to move':'White to move')+(p.phase?' \u00B7 '+p.phase:'')+(p.openingName?' \u00B7 '+p.openingName.replace(/</g,'&lt;'):'')+'</p>';
if(p.tags)html+='<p class="tags">'+p.tags.replace(/</g,'&lt;')+'</p>';
if(p.solution)html+='<button onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'block\'?\'none\':\'block\'">Show / hide solution</button><p class="sol">'+p.solution.replace(/</g,'&lt;')+'</p>';
if(p.notes)html+='<p class="notes">'+p.notes.replace(/</g,'&lt;')+'</p>';
html+='<p class="fen">'+p.fen+'</p></div>';});
document.getElementById('grid').innerHTML=html||'<p>No positions match.</p>';document.getElementById('count').textContent=shown+' position'+(shown===1?'':'s');}
var sel=document.getElementById('folder');DATA.folders.forEach(function(f){var o=document.createElement('option');o.value=String(f.id);o.textContent=f.name;sel.appendChild(o);});
document.getElementById('q').addEventListener('input',render);sel.addEventListener('change',render);document.getElementById('diff').addEventListener('change',render);document.getElementById('phase').addEventListener('change',render);document.getElementById('opening').addEventListener('input',render);render();</script></body></html>
